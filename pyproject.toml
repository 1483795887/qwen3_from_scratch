[build-system]
requires = ["setuptools>=61.0", "wheel", "torch>=2.0.0", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "tokenizers>=0.22.2",
    "torch>=2.0.0",
    "transformers>=5.2.0",
    "triton>=3.6.0; sys_platform == 'linux'",
]
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

# 统一使用 ruff 作为 linter + formatter（VSCode / PyCharm 均原生支持）
[tool.ruff]
line-length = 79
target-version = "py313"  # 与 .python-version 一致
src = ["src"]             # src 布局，用于识别 first-party 包
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I"] # 开启错误、警告和 Import 排序
ignore = ["E501"]        # 忽略单行过长的警告

[tool.ruff.lint.isort]
known-first-party = ["qwen3_from_scratch"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]
